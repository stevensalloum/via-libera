name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI attribution in commits or PR text
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TEXT: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: |
          # Real attribution only: trailer lines, "generated with/by <tool>", the robot badge.
          pattern='^[[:space:]]*co-authored-by:|generated (with|by) \[?(claude|codex|chatgpt|copilot|openai|anthropic)|🤖'
          if { git log --format=%B "$BASE..$HEAD"; printf '%s\n' "$PR_TEXT"; } | grep -inE "$pattern"; then
            echo "::error::Remove AI attribution lines (see AGENTS.md, Commits and PRs)."
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
