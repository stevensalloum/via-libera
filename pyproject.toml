[project]
name = "tabpfn-spatial"
version = "0.1.0"
description = "TabPFN for spatial awareness in robotics (Berlin AIxRobotics Hackathon, Prior Labs track)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Steven" },
    { name = "Rayan" },
    { name = "Ahmad" },
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "tabpfn-client>=0.10",
]

[project.scripts]
tabpfn-check = "tabpfn_spatial.tabpfn_check:main"
spatial-example = "tabpfn_spatial.core.example:main"
leak-demo = "tabpfn_spatial.pipeline:main"
sim-viz = "tabpfn_spatial.sim.viz:main"
evac-live = "tabpfn_spatial.evac.viewer:main"
evac-timing = "tabpfn_spatial.evac.timing:main"
sync-check = "tabpfn_spatial.sync:main"
evac-crowd = "tabpfn_spatial.evac.crowd_study:main"
evac-crowd-live = "tabpfn_spatial.evac.crowd_viewer:main"
world = "tabpfn_spatial.world.serve:main"
closed-loop = "tabpfn_spatial.loop:main"
evac-pipeline = "tabpfn_spatial.evac.pipeline_view:main"
milestone = "tabpfn_spatial.milestone:main"

[project.optional-dependencies]
local = [
    "tabpfn>=10.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabpfn_spatial"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = ["D203", "D213", "D401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --durations=5 --import-mode=importlib"
